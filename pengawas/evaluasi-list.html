<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Evaluasi Kinerja KS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/sispa-v2/assets/css/style.css" />
</head>
<body>

<div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.5rem">
  <div>
    <h1 style="font-size:1.5rem; font-weight:700; color:var(--slate-900); margin:0">Evaluasi Kinerja KS</h1>
    <p style="font-size:0.875rem; color:var(--slate-500); margin:0.25rem 0 0">
      Penilaian kinerja pembelajaran Kepala Sekolah — 30 indikator (Rencana, Pelaksanaan, Asesmen)
    </p>
  </div>
  <div style="display:flex; gap:0.5rem">
    <select id="filterPeriode" class="select" style="width:auto; min-width:200px">
      <option value="">Semua Periode</option>
    </select>
    <select id="filterStatus" class="select" style="width:auto; min-width:130px">
      <option value="">Semua Status</option>
      <option value="draft">Draft</option>
      <option value="final">Final</option>
    </select>
    <button id="btnRefresh" class="btn btn-secondary">
      <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      <span>Refresh</span>
    </button>
    <button id="btnAdd" class="btn btn-primary">
      <i data-lucide="plus" class="w-4 h-4"></i>
      <span>Evaluasi Baru</span>
    </button>
  </div>
</div>

<!-- Stats -->
<div id="miniStats" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:1rem; margin-bottom:1.5rem"></div>

<!-- Tabel -->
<div class="card" style="overflow:hidden">
  <div class="card-header">
    <div style="display:flex; align-items:center; gap:0.5rem">
      <i data-lucide="clipboard-check" class="w-4 h-4" style="color:var(--slate-500)"></i>
      <h2 style="font-weight:600; font-size:0.875rem; color:var(--slate-900); margin:0">Daftar Evaluasi</h2>
      <span id="resultCount" class="badge badge-neutral">0</span>
    </div>
  </div>
  <div id="tableWrap" style="overflow-x:auto">
    <table class="table">
      <thead>
        <tr>
          <th>KS yang Dinilai</th>
          <th>Sekolah</th>
          <th>Periode</th>
          <th style="text-align:center">Capaian</th>
          <th style="text-align:center">Predikat</th>
          <th style="text-align:center">Status</th>
          <th style="text-align:right; width:200px">Aksi</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="hidden empty-state">
    <div class="empty-state-icon"><i data-lucide="clipboard-check" class="w-6 h-6"></i></div>
    <h3 style="font-weight:600; color:var(--slate-900); margin:0 0 0.25rem">Belum ada evaluasi</h3>
    <p style="font-size:0.875rem; color:var(--slate-500); margin:0 0 1rem">Mulai evaluasi kinerja KS pertama</p>
    <button onclick="document.getElementById('btnAdd').click()" class="btn btn-primary">
      <i data-lucide="plus" class="w-4 h-4"></i><span>Evaluasi Baru</span>
    </button>
  </div>
</div>

<script src="/sispa-v2/assets/js/config.js"></script>
<script src="/sispa-v2/assets/js/supabase.js"></script>
<script src="/sispa-v2/assets/js/auth.js"></script>
<script src="/sispa-v2/assets/js/ui.js"></script>
<script src="/sispa-v2/assets/js/app.js"></script>
<script src="/sispa-v2/assets/js/api/evaluasi-ks.js"></script>
<script>
  let user = null;
  let allItems = [];
  let filterPeriode = '';
  let filterStatus = '';

  initPage('pengawas', 'evaluasi', async (u) => {
    user = u;
    initPeriodeOptions();
    await loadData();
  });

  function initPeriodeOptions() {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth() + 1;
    const opts = [];
    if (m >= 7) {
      opts.push(y + '/' + (y+1) + '-Ganjil');
      opts.push((y-1) + '/' + y + '-Genap');
      opts.push((y-1) + '/' + y + '-Ganjil');
    } else {
      opts.push((y-1) + '/' + y + '-Genap');
      opts.push((y-1) + '/' + y + '-Ganjil');
      opts.push((y-2) + '/' + (y-1) + '-Genap');
    }
    const sel = document.getElementById('filterPeriode');
    opts.forEach(p => {
      const o = document.createElement('option');
      o.value = p;
      o.textContent = p;
      sel.appendChild(o);
    });
  }

  async function loadData() {
    await withLoading('Memuat evaluasi...', async () => {
      try {
        allItems = await EvaluasiKsAPI.list({
          pengawas_id: user.id,
          periode: filterPeriode || undefined,
          status: filterStatus || undefined
        });
        renderStats();
        renderTable();
      } catch (err) {
        showToast('Gagal memuat: ' + err.message, 'error');
      }
    });
  }

  function renderStats() {
    const total = allItems.length;
    const final = allItems.filter(e => e.status === 'final').length;
    const draft = allItems.filter(e => e.status === 'draft').length;
    const selesai = allItems.filter(e => e.status === 'final');
    let avg = 0;
    if (selesai.length > 0) {
      avg = selesai.reduce((s, e) => s + (e.persen_capaian || 0), 0) / selesai.length;
    }

    document.getElementById('miniStats').innerHTML = `
      <div class="stat-card">
        <div class="stat-icon" style="background:#e0e7ff; color:#4338ca"><i data-lucide="clipboard-check" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Total</div><div style="font-size:1.25rem; font-weight:700">${total}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#dcfce7; color:#166534"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Final</div><div style="font-size:1.25rem; font-weight:700">${final}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fef3c7; color:#92400e"><i data-lucide="file-edit" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Draft</div><div style="font-size:1.25rem; font-weight:700">${draft}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#dbeafe; color:#1e40af"><i data-lucide="trending-up" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Rata-rata</div><div style="font-size:1.25rem; font-weight:700">${avg.toFixed(1)}%</div></div>
      </div>`;
    refreshIcons();
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    const wrap = document.getElementById('tableWrap');
    const empty = document.getElementById('emptyState');

    wrap.style.display = 'none';
    empty.classList.add('hidden');

    if (!allItems.length) {
      empty.classList.remove('hidden');
      document.getElementById('resultCount').textContent = 0;
      refreshIcons();
      return;
    }
    wrap.style.display = 'block';
    document.getElementById('resultCount').textContent = allItems.length;

    const predikatColor = {
      'Sangat Baik': 'badge-success',
      'Baik': 'badge-info',
      'Cukup': 'badge-warning',
      'Kurang': 'badge-danger'
    };

    tbody.innerHTML = allItems.map(e => {
      const isFinal = e.status === 'final';
      const pct = Math.round(e.persen_capaian || 0);
      const pCls = predikatColor[e.predikat] || 'badge-neutral';

      return `
        <tr>
          <td>
            <div style="font-weight:500; color:var(--slate-900)">${escapeHtml(e.nama_ks || '—')}</div>
            <div style="font-size:0.75rem; color:var(--slate-500)">${formatTanggal(e.tanggal)}</div>
          </td>
          <td style="font-size:0.875rem">${escapeHtml(e.nama_sekolah || '—')}</td>
          <td class="text-mono" style="font-size:0.75rem">${escapeHtml(e.periode)}</td>
          <td style="text-align:center">
            <div style="font-weight:700; font-size:1rem">${pct}%</div>
            <div style="font-size:0.65rem; color:var(--slate-500)">${e.skor_total}/90</div>
          </td>
          <td style="text-align:center"><span class="badge ${pCls}">${escapeHtml(e.predikat || '—')}</span></td>
          <td style="text-align:center">
            <span class="badge ${isFinal ? 'badge-success' : 'badge-neutral'}">${isFinal ? 'Final' : 'Draft'}</span>
          </td>
          <td style="text-align:right; white-space:nowrap">
            <a href="/sispa-v2/pengawas/evaluasi-form.html?id=${e.id}" class="btn btn-secondary" style="font-size:0.75rem; padding:0.35rem 0.6rem">
              ${icon(isFinal ? 'eye' : 'pencil', 'w-3.5 h-3.5')}
              <span>${isFinal ? 'Lihat' : 'Lanjut'}</span>
            </a>
            ${isFinal ? `
              <a href="/sispa-v2/pengawas/evaluasi-cetak.html?id=${e.id}" target="_blank" class="btn btn-primary" style="font-size:0.75rem; padding:0.35rem 0.6rem">
                ${icon('printer', 'w-3.5 h-3.5')}
                <span>Cetak</span>
              </a>` : ''}
          </td>
        </tr>`;
    }).join('');

    refreshIcons();
  }

  document.getElementById('btnAdd').addEventListener('click', () => {
    window.location.href = '/sispa-v2/pengawas/evaluasi-form.html';
  });
  document.getElementById('btnRefresh').addEventListener('click', loadData);
  document.getElementById('filterPeriode').addEventListener('change', e => { filterPeriode = e.target.value; loadData(); });
  document.getElementById('filterStatus').addEventListener('change', e => { filterStatus = e.target.value; loadData(); });
</script>
</body>
</html>
