<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Observasi Akademik (Pengawas)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/sispa-v2/assets/css/style.css" />
</head>
<body>

<div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.5rem">
  <div>
    <h1 style="font-size:1.5rem; font-weight:700; color:var(--slate-900); margin:0">Observasi Akademik</h1>
    <p style="font-size:0.875rem; color:var(--slate-500); margin:0.25rem 0 0">Hasil dari Kepala Sekolah binaan</p>
  </div>
  <button id="btnRefresh" class="btn btn-secondary">
    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
    <span>Refresh</span>
  </button>
</div>

<!-- Stats -->
<div id="miniStats" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:1rem; margin-bottom:1.5rem"></div>

<div class="card" style="overflow:hidden">
  <div class="card-header">
    <div style="display:flex; align-items:center; gap:0.5rem">
      <i data-lucide="tablet" class="w-4 h-4" style="color:var(--slate-500)"></i>
      <h2 style="font-weight:600; font-size:0.875rem; color:var(--slate-900); margin:0">Daftar Observasi Terkirim</h2>
      <span id="resultCount" class="badge badge-neutral">0</span>
    </div>
  </div>
  <div id="tableWrap" style="overflow-x:auto">
    <table class="table">
      <thead>
        <tr>
          <th>Guru</th>
          <th>Sekolah</th>
          <th>Supervisor</th>
          <th>Tanggal</th>
          <th style="text-align:center">Skor</th>
          <th style="text-align:center">Kategori</th>
          <th style="text-align:right; width:130px">Aksi</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="hidden empty-state">
    <div class="empty-state-icon"><i data-lucide="inbox" class="w-6 h-6"></i></div>
    <h3 style="font-weight:600; color:var(--slate-900); margin:0 0 0.25rem">Belum ada yang terkirim</h3>
    <p style="font-size:0.875rem; color:var(--slate-500); margin:0">Menunggu Kepala Sekolah mengirim instrumen</p>
  </div>
</div>

<script src="/sispa-v2/assets/js/config.js"></script>
<script src="/sispa-v2/assets/js/supabase.js"></script>
<script src="/sispa-v2/assets/js/auth.js"></script>
<script src="/sispa-v2/assets/js/ui.js"></script>
<script src="/sispa-v2/assets/js/app.js"></script>
<script src="/sispa-v2/assets/js/api/obs-akademik.js"></script>
<script>
  let items = [];

  initPage('pengawas', 'obs-akademik-ps', async () => {
    await loadData();
  });

  async function loadData() {
    await withLoading('Memuat...', async () => {
      try {
        items = await ObsAkademikAPI.listForPengawas({});
        render();
      } catch (err) { showToast('Gagal: ' + err.message, 'error'); }
    });
  }

  function render() {
    // Stats
    const total = items.length;
    const avgSkor = total > 0 ? (items.reduce((s, x) => s + (x.skor_total || 0), 0) / total).toFixed(1) : 0;
    const mahir = items.filter(x => x.kategori === 'Mahir').length;
    const sekolahUnik = new Set(items.map(x => x.npsn_sekolah)).size;

    document.getElementById('miniStats').innerHTML = `
      <div class="stat-card">
        <div class="stat-icon" style="background:#e0e7ff; color:#4338ca"><i data-lucide="clipboard-check" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Total Terkirim</div><div style="font-size:1.25rem; font-weight:700">${total}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#dcfce7; color:#166534"><i data-lucide="award" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Kategori Mahir</div><div style="font-size:1.25rem; font-weight:700">${mahir}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fef3c7; color:#92400e"><i data-lucide="trending-up" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Rata-rata Skor</div><div style="font-size:1.25rem; font-weight:700">${avgSkor}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#dbeafe; color:#1e40af"><i data-lucide="building-2" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Sekolah</div><div style="font-size:1.25rem; font-weight:700">${sekolahUnik}</div></div>
      </div>`;
    refreshIcons();

    // Table
    const tbody = document.getElementById('tableBody');
    const wrap = document.getElementById('tableWrap');
    const empty = document.getElementById('emptyState');
    wrap.style.display = 'none'; empty.classList.add('hidden');

    document.getElementById('resultCount').textContent = items.length;

    if (items.length === 0) {
      empty.classList.remove('hidden');
      refreshIcons(); return;
    }
    wrap.style.display = 'block';

    tbody.innerHTML = items.map(x => {
      let badgeCls = 'badge-neutral';
      if (x.kategori === 'Mahir') badgeCls = 'badge-success';
      else if (x.kategori === 'Berkembang') badgeCls = 'badge-info';
      else if (x.kategori === 'Mulai Terlihat') badgeCls = 'badge-warning';

      return `
        <tr>
          <td>
            <div style="font-weight:500;">${escapeHtml(x.guru?.nama || '—')}</div>
            <div style="font-size:0.75rem; color:var(--slate-500);">${escapeHtml(x.mapel || '')}${x.guru?.kelas ? ' · ' + escapeHtml(x.guru.kelas) : ''}</div>
          </td>
          <td style="font-size:0.875rem;">
            <div>${escapeHtml(x.sekolah?.nama || '—')}</div>
            <div style="font-size:0.7rem; color:var(--slate-500);">${escapeHtml(x.sekolah?.kecamatan || '')}</div>
          </td>
          <td style="font-size:0.875rem;">
            <div>${escapeHtml(x.supervisor?.nama || '—')}</div>
            <div style="font-size:0.7rem; color:var(--slate-500);">${x.submitted_at ? 'Dikirim ' + formatTanggal(x.submitted_at) : ''}</div>
          </td>
          <td style="font-size:0.875rem;">${formatTanggal(x.tanggal)}</td>
          <td style="text-align:center; font-weight:700;">${x.skor_total} <span style="font-size:0.7rem; font-weight:400; color:var(--slate-500);">/ 76</span></td>
          <td style="text-align:center;"><span class="badge ${badgeCls}">${x.kategori}</span></td>
          <td style="text-align:right; white-space:nowrap;">
            <a href="/sispa-v2/ks/obs-akademik-cetak.html?id=${x.id}" target="_blank" class="btn btn-primary" style="font-size:0.75rem; padding:0.35rem 0.6rem;">${icon('printer', 'w-3.5 h-3.5')}<span>Cetak</span></a>
          </td>
        </tr>`;
    }).join('');
    refreshIcons();
  }

  document.getElementById('btnRefresh').addEventListener('click', loadData);
</script>
</body>
</html>
