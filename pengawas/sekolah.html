<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Detail Sekolah</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/sispa-v2/assets/css/style.css" />
</head>
<body>

<div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.5rem">
  <div>
    <h1 id="pageTitle" style="font-size:1.5rem; font-weight:700; color:var(--slate-900); margin:0">Detail Sekolah</h1>
    <p id="pageSubtitle" style="font-size:0.875rem; color:var(--slate-500); margin:0.25rem 0 0">Memuat...</p>
  </div>
  <div style="display:flex; gap:0.5rem">
    <button id="btnExport" class="btn btn-secondary">
      <i data-lucide="download" class="w-4 h-4"></i>
      <span>Export CSV</span>
    </button>
    <a href="/sispa-v2/pengawas/dashboard.html" class="btn btn-ghost">
      <i data-lucide="arrow-left" class="w-4 h-4"></i>
      <span>Kembali</span>
    </a>
  </div>
</div>

<!-- Info Sekolah -->
<div id="infoSekolah" class="card" style="margin-bottom:1.5rem; display:none">
  <div class="card-body" style="display:flex; align-items:flex-start; gap:1.25rem; flex-wrap:wrap">
    <div id="skAvatar" style="width:64px; height:64px; border-radius:12px; background:var(--brand-50); color:var(--brand-600); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.5rem; flex-shrink:0">—</div>
    <div style="flex:1; min-width:220px">
      <div id="skNama" style="font-size:1.125rem; font-weight:700; color:var(--slate-900)">—</div>
      <div id="skMeta" style="font-size:0.8rem; color:var(--slate-500); margin-top:0.25rem">—</div>
      <div id="skAlamat" style="font-size:0.75rem; color:var(--slate-500); margin-top:0.5rem">—</div>
    </div>
  </div>
</div>

<!-- Ringkasan -->
<div id="miniStats" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:1rem; margin-bottom:1.5rem"></div>

<!-- Tabel Guru + Tipe -->
<div class="card" style="margin-bottom:1.5rem; overflow:hidden">
  <div class="card-header">
    <div style="display:flex; align-items:center; gap:0.5rem">
      <i data-lucide="users" class="w-4 h-4" style="color:var(--slate-500)"></i>
      <h2 style="font-weight:600; font-size:0.875rem; color:var(--slate-900); margin:0">Guru & Tipe</h2>
      <span id="guruCount" class="badge badge-neutral">0</span>
    </div>
  </div>
  <div id="tableWrap" style="overflow-x:auto">
    <table class="table">
      <thead>
        <tr>
          <th>Guru</th>
          <th style="text-align:center">Abstraksi</th>
          <th style="text-align:center">Komitmen</th>
          <th style="text-align:center">Tipe</th>
          <th style="text-align:center">Supervisi</th>
          <th>Terakhir</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="hidden empty-state">
    <div class="empty-state-icon"><i data-lucide="users" class="w-6 h-6"></i></div>
    <h3 style="font-weight:600; color:var(--slate-900); margin:0 0 0.25rem">Belum ada guru</h3>
    <p style="font-size:0.875rem; color:var(--slate-500); margin:0">Belum ada guru aktif di sekolah ini</p>
  </div>
</div>

<!-- Riwayat Supervisi Terbaru -->
<div class="card" style="overflow:hidden">
  <div class="card-header">
    <div style="display:flex; align-items:center; gap:0.5rem">
      <i data-lucide="history" class="w-4 h-4" style="color:var(--slate-500)"></i>
      <h2 style="font-weight:600; font-size:0.875rem; color:var(--slate-900); margin:0">Riwayat Supervisi</h2>
      <span id="supCount" class="badge badge-neutral">0</span>
    </div>
  </div>
  <div id="supWrap" style="overflow-x:auto">
    <table class="table">
      <thead>
        <tr>
          <th>Guru</th>
          <th style="text-align:center">Pendekatan</th>
          <th>Mulai</th>
          <th>Selesai</th>
          <th style="text-align:center">Status</th>
          <th style="text-align:right; width:100px">Aksi</th>
        </tr>
      </thead>
      <tbody id="supBody"></tbody>
    </table>
  </div>
  <div id="supEmpty" class="hidden empty-state">
    <div class="empty-state-icon"><i data-lucide="clipboard-check" class="w-6 h-6"></i></div>
    <h3 style="font-weight:600; color:var(--slate-900); margin:0 0 0.25rem">Belum ada supervisi</h3>
    <p style="font-size:0.875rem; color:var(--slate-500); margin:0">Belum ada supervisi di sekolah ini</p>
  </div>
</div>

<script src="/sispa-v2/assets/js/config.js"></script>
<script src="/sispa-v2/assets/js/supabase.js"></script>
<script src="/sispa-v2/assets/js/auth.js"></script>
<script src="/sispa-v2/assets/js/ui.js"></script>
<script src="/sispa-v2/assets/js/app.js"></script>
<script src="/sispa-v2/assets/js/api/pengawas.js"></script>
<script>
  let user = null;
  let npsn = '';
  let detailData = null;

  const params = new URLSearchParams(window.location.search);
  npsn = params.get('npsn') || '';

  initPage('pengawas', 'dashboard', async (u) => {
    user = u;
    if (!npsn) {
      showToast('Parameter NPSN tidak ditemukan', 'error');
      setTimeout(() => window.location.href = '/sispa-v2/pengawas/dashboard.html', 1500);
      return;
    }
    await loadData();
  });

  async function loadData() {
    await withLoading('Memuat detail sekolah...', async () => {
      try {
        detailData = await PengawasAPI.sekolahDetail(npsn);
        renderInfo(detailData.sekolah);
        renderStats(detailData);
        renderGuruTable(detailData.guru);
        renderSupervisiTable(detailData.supervisi);
      } catch (err) {
        console.error(err);
        showToast('Gagal memuat: ' + err.message, 'error');
      }
    });
  }

  function renderInfo(sk) {
    document.getElementById('infoSekolah').style.display = 'block';
    document.getElementById('pageTitle').textContent = sk.nama || 'Detail Sekolah';
    document.getElementById('pageSubtitle').textContent = 'NPSN ' + sk.npsn;
    document.getElementById('skAvatar').textContent = (sk.nama || 'S').charAt(0).toUpperCase();
    document.getElementById('skNama').textContent = sk.nama;

    const metaParts = [sk.jenjang, sk.status === 'aktif' ? 'Aktif' : 'Nonaktif'].filter(Boolean);
    document.getElementById('skMeta').textContent = metaParts.join(' · ');

    const alamatParts = [sk.alamat, sk.kecamatan, sk.kabupaten, sk.provinsi].filter(Boolean);
    document.getElementById('skAlamat').textContent = alamatParts.length > 0 ? alamatParts.join(', ') : '(Alamat belum diisi)';
  }

  function renderStats(d) {
    const r = d.ringkasan;
    const totalSk = r.sudah_dinilai + r.belum_dinilai;
    const pctDinilai = totalSk > 0 ? Math.round((r.sudah_dinilai / totalSk) * 100) : 0;

    document.getElementById('miniStats').innerHTML = `
      <div class="stat-card">
        <div class="stat-icon" style="background:#e0e7ff; color:#4338ca"><i data-lucide="users" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Total Guru</div><div style="font-size:1.25rem; font-weight:700">${r.total_guru}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#dcfce7; color:#166534"><i data-lucide="compass" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Sudah Dinilai</div><div style="font-size:1.25rem; font-weight:700">${r.sudah_dinilai} <span style="font-size:0.75rem; color:var(--slate-400); font-weight:400">(${pctDinilai}%)</span></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fef3c7; color:#92400e"><i data-lucide="clock" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Belum Dinilai</div><div style="font-size:1.25rem; font-weight:700">${r.belum_dinilai}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#dbeafe; color:#1e40af"><i data-lucide="clipboard-check" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Supervisi Selesai</div><div style="font-size:1.25rem; font-weight:700">${r.supervisi_selesai} <span style="font-size:0.75rem; color:var(--slate-400); font-weight:400">/ ${r.total_supervisi}</span></div></div>
      </div>`;
    refreshIcons();
  }

  function renderGuruTable(guruList) {
    const tbody = document.getElementById('tableBody');
    const wrap = document.getElementById('tableWrap');
    const empty = document.getElementById('emptyState');

    wrap.style.display = 'none';
    empty.classList.add('hidden');

    document.getElementById('guruCount').textContent = guruList.length;

    if (!guruList.length) {
      empty.classList.remove('hidden');
      refreshIcons();
      return;
    }
    wrap.style.display = 'block';

    const tipeBadge = {
      dropout: { cls: 'badge-danger', label: 'Dropout' },
      unfocused_worker: { cls: 'badge-warning', label: 'Unfocused' },
      analytical_observer: { cls: 'badge-info', label: 'Analytical' },
      professional: { cls: 'badge-success', label: 'Professional' }
    };

    tbody.innerHTML = guruList.map(g => {
      const t = g.tipe;
      const info = t ? tipeBadge[t.tipe] : null;

      return `
        <tr>
          <td>
            <div style="display:flex; align-items:center; gap:0.75rem">
              <div style="width:36px; height:36px; border-radius:50%; background:var(--brand-50); color:var(--brand-600); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:0.875rem; flex-shrink:0">
                ${escapeHtml((g.nama || 'G').charAt(0).toUpperCase())}
              </div>
              <div style="min-width:0">
                <div style="font-weight:500; color:var(--slate-900)">${escapeHtml(g.nama)}</div>
                <div style="font-size:0.75rem; color:var(--slate-500)">${escapeHtml(g.mapel || '—')}${g.kelas ? ' · Kelas ' + escapeHtml(g.kelas) : ''}</div>
              </div>
            </div>
          </td>
          <td style="text-align:center">
            ${t ? (t.level_abstraksi === 'tinggi'
              ? '<span class="badge badge-success">T</span>'
              : '<span class="badge badge-danger">R</span>')
              : '<span style="color:var(--slate-400); font-size:0.75rem">—</span>'}
          </td>
          <td style="text-align:center">
            ${t ? (t.level_komitmen === 'tinggi'
              ? '<span class="badge badge-success">T</span>'
              : '<span class="badge badge-danger">R</span>')
              : '<span style="color:var(--slate-400); font-size:0.75rem">—</span>'}
          </td>
          <td style="text-align:center">
            ${info ? `<span class="badge ${info.cls}">${info.label}</span>`
              : '<span style="font-size:0.75rem; color:var(--slate-400)">Belum</span>'}
          </td>
          <td style="text-align:center">
            <div style="font-weight:600">${g.supervisi_selesai}</div>
            <div style="font-size:0.7rem; color:var(--slate-500)">dari ${g.total_supervisi}</div>
          </td>
          <td style="font-size:0.8rem">${g.supervisi_terakhir ? formatTanggal(g.supervisi_terakhir) : '<span style="color:var(--slate-400)">—</span>'}</td>
        </tr>`;
    }).join('');

    refreshIcons();
  }

  function renderSupervisiTable(supList) {
    const tbody = document.getElementById('supBody');
    const wrap = document.getElementById('supWrap');
    const empty = document.getElementById('supEmpty');

    wrap.style.display = 'none';
    empty.classList.add('hidden');
    document.getElementById('supCount').textContent = supList.length;

    if (!supList.length) {
      empty.classList.remove('hidden');
      refreshIcons();
      return;
    }
    wrap.style.display = 'block';

    const pendekatanLabel = (p) => p ? p.replace(/_/g,'-').replace(/\b\w/g, c => c.toUpperCase()) : '—';
    const statusInfo = (s) => ({
      draft: { label: 'Draft', cls: 'badge-neutral' },
      pra_observasi: { label: 'Pra-Obs', cls: 'badge-info' },
      observasi: { label: 'Observasi', cls: 'badge-warning' },
      pasca_observasi: { label: 'Pasca-Obs', cls: 'badge-warning' },
      selesai: { label: 'Selesai', cls: 'badge-success' }
    }[s] || { label: s, cls: 'badge-neutral' });

    tbody.innerHTML = supList.map(s => {
      const st = statusInfo(s.status);
      const isSelesai = s.status === 'selesai';

      return `
        <tr>
          <td style="font-size:0.875rem">${escapeHtml(s.guru?.nama || '—')}</td>
          <td style="text-align:center; font-size:0.8rem">${pendekatanLabel(s.pendekatan)}</td>
          <td style="font-size:0.8rem">${s.tanggal_mulai ? formatTanggal(s.tanggal_mulai) : '—'}</td>
          <td style="font-size:0.8rem">${s.tanggal_selesai ? formatTanggal(s.tanggal_selesai) : '<span style="color:var(--slate-400)">—</span>'}</td>
          <td style="text-align:center"><span class="badge ${st.cls}">${st.label}</span></td>
          <td style="text-align:right">
            ${isSelesai ? `
              <a href="/sispa-v2/ks/cetak-supervisi.html?id=${s.id}" target="_blank" class="btn btn-secondary" style="font-size:0.75rem; padding:0.3rem 0.55rem">
                ${icon('printer', 'w-3.5 h-3.5')}
                <span>Cetak</span>
              </a>` : '<span style="font-size:0.75rem; color:var(--slate-400)">—</span>'}
          </td>
        </tr>`;
    }).join('');

    refreshIcons();
  }

  // Export CSV
  document.getElementById('btnExport').addEventListener('click', () => {
    if (!detailData) return showToast('Data belum siap', 'warning');

    const sk = detailData.sekolah;
    const rows = [
      ['NPSN', sk.npsn],
      ['Nama Sekolah', sk.nama],
      ['Jenjang', sk.jenjang || ''],
      ['Kecamatan', sk.kecamatan || ''],
      [],
      ['Nama Guru', 'NIP', 'Mapel', 'Kelas', 'Abstraksi', 'Komitmen', 'Tipe', 'Pendekatan', 'Supervisi Selesai', 'Total Supervisi']
    ];

    detailData.guru.forEach(g => {
      const t = g.tipe;
      rows.push([
        g.nama,
        g.nip || '',
        g.mapel || '',
        g.kelas || '',
        t ? t.level_abstraksi : '',
        t ? t.level_komitmen : '',
        t ? t.tipe : '',
        t ? t.pendekatan_rekomendasi : '',
        g.supervisi_selesai,
        g.total_supervisi
      ]);
    });

    const csv = rows.map(r => r.map(cell => {
      const s = String(cell == null ? '' : cell);
      return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',')).join('\n');

    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'SISPA_' + sk.npsn + '_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('File CSV diunduh', 'success');
  });
</script>
</body>
</html>
