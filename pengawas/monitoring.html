<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Monitoring Sekolah</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/sispa-v2/assets/css/style.css" />
<style>
  .school-card {
    transition: transform .2s, box-shadow .2s, border-color .2s;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .school-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
    border-color: var(--brand-300);
  }
</style>
</head>
<body>

<div style="margin-bottom:1.5rem">
  <h1 style="font-size:1.5rem; font-weight:700; color:var(--slate-900); margin:0">Monitoring Sekolah</h1>
  <p style="font-size:0.875rem; color:var(--slate-500); margin:0.25rem 0 0">Pilih sekolah binaan untuk memantau Profil Guru, Program, dan Supervisi.</p>
</div>

<div id="schoolGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:1.25rem; margin-bottom:3rem">
  <div style="text-align:center; color:var(--slate-400); padding:3rem; grid-column:1/-1">
    <i data-lucide="loader-2" class="w-8 h-8 animate-spin" style="margin:0 auto 1rem"></i>
    <div>Memuat data sekolah...</div>
  </div>
</div>

<div id="emptyState" class="hidden card empty-state" style="margin-top:2rem">
  <div class="empty-state-icon"><i data-lucide="school" class="w-6 h-6"></i></div>
  <h3 style="font-weight:600; color:var(--slate-900); margin:0 0 0.25rem">Belum ada sekolah binaan</h3>
  <p style="font-size:0.875rem; color:var(--slate-500); margin:0 0 1rem">Anda belum ditugaskan ke sekolah mana pun, atau belum memilih Dabin.</p>
  <a href="/sispa-v2/pengawas/dabin.html" class="btn btn-primary">Atur Dabin</a>
</div>

<script src="/sispa-v2/assets/js/config.js"></script>
<script src="/sispa-v2/assets/js/supabase.js"></script>
<script src="/sispa-v2/assets/js/auth.js"></script>
<script src="/sispa-v2/assets/js/ui.js"></script>
<script src="/sispa-v2/assets/js/app.js"></script>
<script>
  let user = null;

  initPage('pengawas', 'monitoring', async (u) => {
    user = u;
    await loadData();
  });

  async function loadData() {
    try {
      // 1. Ambil sekolah binaan
      const { data: dabin, error: errD } = await sb
        .from('pengawas_sekolah')
        .select(`
          npsn_sekolah,
          sekolah:sekolah!pengawas_sekolah_npsn_sekolah_fkey(npsn, nama, jenjang, kecamatan)
        `)
        .eq('pengawas_id', user.id);

      if (errD) throw errD;

      if (!dabin || dabin.length === 0) {
        document.getElementById('schoolGrid').style.display = 'none';
        document.getElementById('emptyState').classList.remove('hidden');
        refreshIcons();
        return;
      }

      // Render skeleton cards dulu
      const grid = document.getElementById('schoolGrid');
      grid.innerHTML = dabin.map(d => {
        const s = d.sekolah;
        return `
          <div class="card school-card" onclick="window.location.href='/sispa-v2/pengawas/monitoring-detail.html?npsn=${s.npsn}'">
            <div class="card-body" style="padding:1.25rem; flex:1">
              <div style="display:flex; align-items:flex-start; gap:0.75rem; margin-bottom:1rem">
                <div style="width:44px; height:44px; border-radius:10px; background:var(--brand-50); color:var(--brand-600); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.1rem; flex-shrink:0">
                  ${s.nama.charAt(0).toUpperCase()}
                </div>
                <div style="flex:1; min-width:0">
                  <h3 style="font-weight:700; font-size:0.95rem; color:var(--slate-900); margin:0; line-height:1.3">${escapeHtml(s.nama)}</h3>
                  <div style="font-size:0.75rem; color:var(--slate-500); margin-top:0.15rem">
                    <span class="text-mono">${s.npsn}</span> · ${escapeHtml(s.jenjang || '-')}
                  </div>
                </div>
              </div>
              <div id="stats-${s.npsn}" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:0.5rem; background:var(--slate-50); padding:0.75rem; border-radius:8px;">
                <div style="text-align:center; color:var(--slate-400); font-size:0.7rem">Memuat...</div>
              </div>
            </div>
            <div style="padding:0.85rem 1.25rem; border-top:1px solid var(--slate-100); text-align:right">
              <span style="font-size:0.8rem; font-weight:600; color:var(--brand-600); display:inline-flex; align-items:center; gap:0.25rem">
                Lihat Detail ${icon('arrow-right', 'w-3.5 h-3.5')}
              </span>
            </div>
          </div>
        `;
      }).join('');

      refreshIcons();

      // 2. Fetch stats per sekolah secara paralel
      dabin.forEach(async (d) => {
        const npsn = d.sekolah.npsn;
        try {
          const [guruRes, progRes, supRes, obsAkadRes, obsCoachRes] = await Promise.all([
            sb.from('guru').select('*', { count: 'exact', head: true }).eq('npsn_sekolah', npsn).eq('status', 'aktif'),
            sb.from('program_supervisi').select('*', { count: 'exact', head: true }).eq('npsn_sekolah', npsn),
            sb.from('supervisi').select('*', { count: 'exact', head: true }).eq('npsn_sekolah', npsn),
            sb.from('obs_akademik').select('*', { count: 'exact', head: true }).eq('npsn_sekolah', npsn),
            sb.from('obs_coaching').select('*', { count: 'exact', head: true }).eq('npsn_sekolah', npsn)
          ]);

          const totalSupervisi = (supRes.count || 0) + (obsAkadRes.count || 0) + (obsCoachRes.count || 0);
          
          const statsEl = document.getElementById(`stats-${npsn}`);
          if (statsEl) {
            statsEl.innerHTML = `
              <div style="text-align:center">
                <div style="font-size:1.1rem; font-weight:700; color:var(--slate-900)">${guruRes.count || 0}</div>
                <div style="font-size:0.65rem; color:var(--slate-500); text-transform:uppercase; letter-spacing:0.03em">Guru</div>
              </div>
              <div style="text-align:center">
                <div style="font-size:1.1rem; font-weight:700; color:var(--slate-900)">${progRes.count || 0}</div>
                <div style="font-size:0.65rem; color:var(--slate-500); text-transform:uppercase; letter-spacing:0.03em">Program</div>
              </div>
              <div style="text-align:center">
                <div style="font-size:1.1rem; font-weight:700; color:var(--brand-600)">${totalSupervisi}</div>
                <div style="font-size:0.65rem; color:var(--slate-500); text-transform:uppercase; letter-spacing:0.03em">Supervisi</div>
              </div>
            `;
          }
        } catch (err) {
          console.error('Gagal memuat stats', npsn, err);
        }
      });

    } catch (err) {
      showToast('Gagal memuat: ' + err.message, 'error');
    }
  }
</script>
</body>
</html>
