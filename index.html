<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISPA v2 — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
  <h1 class="text-2xl font-bold text-indigo-700 mb-2">SISPA v2</h1>
  <p class="text-sm text-slate-500 mb-6">Sistem Informasi Supervisi Pendidikan Akademik</p>

  <form id="loginForm" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" id="email" required 
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" id="password" required
             class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500" />
    </div>
    <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 p-2 rounded"></div>
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-semibold">
      Masuk
    </button>
  </form>
</div>

<script src="./assets/js/config.js"></script>
<script src="./assets/js/supabase.js"></script>
<script src="./assets/js/auth.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  const errBox = document.getElementById('errorMsg');
  errBox.classList.add('hidden');
  btn.disabled = true;
  btn.textContent = 'Memproses...';

  try {
    const data = await login(
      document.getElementById('email').value,
      document.getElementById('password').value
    );
    
    // Redirect berdasarkan role
    const profile = await getCurrentUser();
    if (profile.role === 'admin') window.location.href = '/sispa-v2/admin/dashboard.html';
    else if (profile.role === 'pengawas') window.location.href = '/sispa-v2/pengawas/dashboard.html';
    else window.location.href = '/sispa-v2/ks/dashboard.html';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Masuk';
  }
});
</script>
</body>
</html>
