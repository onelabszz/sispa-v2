<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Halaman Tidak Ditemukan</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="/sispa-v2/assets/css/style.css" />
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem">

<div style="text-align:center; max-width:520px">

  <div style="width:120px; height:120px; margin:0 auto 1.5rem; background:linear-gradient(135deg, #4f46e5 0%, #4338ca 100%); border-radius:24px; display:flex; align-items:center; justify-content:center; box-shadow:0 20px 40px rgba(79,70,229,.25)">
    <i data-lucide="search-x" style="width:56px; height:56px; color:white"></i>
  </div>

  <h1 style="font-size:4rem; font-weight:800; color:var(--slate-900); margin:0; line-height:1">404</h1>
  <h2 style="font-size:1.25rem; font-weight:600; color:var(--slate-800); margin:0.75rem 0 0.5rem">
    Halaman Tidak Ditemukan
  </h2>
  <p style="font-size:0.9rem; color:var(--slate-500); line-height:1.7; margin:0 0 2rem">
    Halaman yang Anda cari tidak ada, sudah dipindahkan, atau mungkin URL-nya salah ketik.
  </p>

  <div style="display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap">
    <a href="/sispa-v2/index.html" class="btn btn-primary">
      <i data-lucide="home" class="w-4 h-4"></i>
      <span>Ke Halaman Login</span>
    </a>
    <a href="/sispa-v2/panduan.html" class="btn btn-secondary">
      <i data-lucide="book-open" class="w-4 h-4"></i>
      <span>Baca Panduan</span>
    </a>
  </div>

  <div style="margin-top:2rem; font-size:0.75rem; color:var(--slate-400)">
    Jika Anda yakin ini kesalahan, hubungi administrator aplikasi.
  </div>

</div>

<script>
  (function refreshIcons() {
    if (window.lucide) window.lucide.createIcons();
    else setTimeout(refreshIcons, 100);
  })();
</script>
</body>
</html>
