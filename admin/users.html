<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SISPA — Kelola Users</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/sispa-v2/assets/css/style.css" />
</head>
<body>

<div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:1.5rem">
  <div>
    <h1 style="font-size:1.5rem; font-weight:700; color:var(--slate-900); margin:0">Kelola Users</h1>
    <p style="font-size:0.875rem; color:var(--slate-500); margin:0.25rem 0 0">Kelola akun admin, pengawas, kepala sekolah, dan guru</p>
  </div>
  <div style="display:flex; gap:0.5rem">
    <button id="btnRefresh" class="btn btn-secondary">
      <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      <span>Refresh</span>
    </button>
    <button id="btnAdd" class="btn btn-primary">
      <i data-lucide="user-plus" class="w-4 h-4"></i>
      <span>Tambah User</span>
    </button>
  </div>
</div>

<div id="miniStats" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:1rem; margin-bottom:1.5rem"></div>

<div class="card" style="margin-bottom:1rem">
  <div class="card-body" style="display:grid; grid-template-columns: 2fr 1fr 1fr auto; gap:0.75rem; align-items:center">
    <div style="position:relative">
      <span style="position:absolute; left:0.75rem; top:50%; transform:translateY(-50%); color:var(--slate-400)">
        <i data-lucide="search" class="w-4 h-4"></i>
      </span>
      <input type="text" id="searchInput" class="input" style="padding-left:2.4rem" placeholder="Cari nama / email / NIP..." />
    </div>
    <select id="filterRole" class="select">
      <option value="">Semua Role</option>
      <option value="admin">Admin</option>
      <option value="pengawas">Pengawas</option>
      <option value="ks">Kepala Sekolah</option>
      <option value="guru">Guru</option>
    </select>
    <select id="filterStatus" class="select">
      <option value="">Semua Status</option>
      <option value="aktif">Aktif</option>
      <option value="nonaktif">Nonaktif</option>
    </select>
    <button id="btnReset" class="btn btn-ghost">Reset</button>
  </div>
</div>

<div class="card" style="overflow:hidden">
  <div class="card-header">
    <div style="display:flex; align-items:center; gap:0.5rem">
      <i data-lucide="users" class="w-4 h-4" style="color:var(--slate-500)"></i>
      <h2 style="font-weight:600; font-size:0.875rem; color:var(--slate-900); margin:0">Daftar User</h2>
      <span id="resultCount" class="badge badge-neutral">0</span>
    </div>
  </div>
  <div id="tableWrap" style="overflow-x:auto">
    <table class="table">
      <thead>
        <tr>
          <th>User</th>
          <th>Sekolah</th>
          <th style="text-align:center">Role</th>
          <th>Kontak</th>
          <th style="text-align:center">Status</th>
          <th style="text-align:right; width:220px">Aksi</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="hidden empty-state">
    <div class="empty-state-icon"><i data-lucide="users" class="w-6 h-6"></i></div>
    <h3 style="font-weight:600; color:var(--slate-900); margin:0 0 0.25rem">Belum ada user</h3>
    <p style="font-size:0.875rem; color:var(--slate-500); margin:0">Tambahkan user pertama</p>
  </div>
  <div id="noResultState" class="hidden empty-state">
    <div class="empty-state-icon"><i data-lucide="search-x" class="w-6 h-6"></i></div>
    <h3 style="font-weight:600; color:var(--slate-900); margin:0 0 0.25rem">Tidak ada hasil</h3>
    <p style="font-size:0.875rem; color:var(--slate-500); margin:0">Coba ubah filter</p>
  </div>
</div>

<script src="/sispa-v2/assets/js/config.js"></script>
<script src="/sispa-v2/assets/js/supabase.js"></script>
<script src="/sispa-v2/assets/js/auth.js"></script>
<script src="/sispa-v2/assets/js/ui.js"></script>
<script src="/sispa-v2/assets/js/app.js"></script>
<script src="/sispa-v2/assets/js/api/users.js"></script>
<script>
  let allItems = [];
  let filterText = '';
  let filterRole = '';
  let filterStatus = '';
  let currentUser = null;

  initPage('admin', 'users', async (user) => {
    currentUser = user;
    await loadData();
  });

  async function loadData() {
    await withLoading('Memuat data user...', async () => {
      try {
        allItems = await UsersAPI.list();
        renderStats();
        renderTable();
      } catch (err) {
        showToast('Gagal memuat: ' + err.message, 'error');
      }
    });
  }

  function renderStats() {
    const total = allItems.length;
    const admin = allItems.filter(u => u.role === 'admin').length;
    const pengawas = allItems.filter(u => u.role === 'pengawas').length;
    const ks = allItems.filter(u => u.role === 'ks').length;
    const nonaktif = allItems.filter(u => u.status === 'nonaktif').length;

    document.getElementById('miniStats').innerHTML = `
      <div class="stat-card">
        <div class="stat-icon" style="background:#e0e7ff; color:#4338ca"><i data-lucide="users" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Total</div><div style="font-size:1.25rem; font-weight:700">${total}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fef3c7; color:#92400e"><i data-lucide="shield" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Admin</div><div style="font-size:1.25rem; font-weight:700">${admin}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#dbeafe; color:#1e40af"><i data-lucide="shield-check" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Pengawas</div><div style="font-size:1.25rem; font-weight:700">${pengawas}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#dcfce7; color:#166534"><i data-lucide="school" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">KS</div><div style="font-size:1.25rem; font-weight:700">${ks}</div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fee2e2; color:#991b1b"><i data-lucide="user-x" class="w-5 h-5"></i></div>
        <div><div style="font-size:0.75rem; color:var(--slate-500)">Nonaktif</div><div style="font-size:1.25rem; font-weight:700">${nonaktif}</div></div>
      </div>`;
    refreshIcons();
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    const wrap = document.getElementById('tableWrap');
    const empty = document.getElementById('emptyState');
    const noResult = document.getElementById('noResultState');

    wrap.style.display = 'none';
    empty.classList.add('hidden');
    noResult.classList.add('hidden');

    if (!allItems.length) {
      empty.classList.remove('hidden');
      document.getElementById('resultCount').textContent = 0;
      refreshIcons();
      return;
    }

    let filtered = allItems.slice();
    if (filterText) {
      const q = filterText.toLowerCase();
      filtered = filtered.filter(u =>
        (u.nama || '').toLowerCase().includes(q) ||
        (u.email || '').toLowerCase().includes(q) ||
        (u.nip || '').includes(q)
      );
    }
    if (filterRole) filtered = filtered.filter(u => u.role === filterRole);
    if (filterStatus) filtered = filtered.filter(u => u.status === filterStatus);

    document.getElementById('resultCount').textContent = filtered.length + ' / ' + allItems.length;

    if (!filtered.length) {
      noResult.classList.remove('hidden');
      refreshIcons();
      return;
    }
    wrap.style.display = 'block';

    const roleLabel = { admin: 'Admin', pengawas: 'Pengawas', ks: 'Kepala Sekolah', guru: 'Guru' };
    const roleCls = { admin: 'badge-warning', pengawas: 'badge-info', ks: 'badge-neutral', guru: 'badge-neutral' };

    tbody.innerHTML = filtered.map(u => {
      const statusCls = u.status === 'aktif' ? 'badge-success' : 'badge-danger';
      const isSelf = u.id === currentUser.id;

      return `
        <tr>
          <td>
            <div style="display:flex; align-items:center; gap:0.75rem">
              <div style="width:36px; height:36px; border-radius:50%; background:var(--brand-50); color:var(--brand-600); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:0.875rem; flex-shrink:0">
                ${escapeHtml((u.nama || u.email || 'U').charAt(0).toUpperCase())}
              </div>
              <div style="min-width:0">
                <div style="font-weight:500; color:var(--slate-900)">${escapeHtml(u.nama || '(belum diisi)')}${isSelf ? ' <span style="font-size:0.75rem; color:var(--slate-400)">(Anda)</span>' : ''}</div>
                <div style="font-size:0.75rem; color:var(--slate-500); overflow:hidden; text-overflow:ellipsis">${escapeHtml(u.email || '')}</div>
              </div>
            </div>
          </td>
          <td style="font-size:0.75rem">${escapeHtml(u.nama_sekolah || '—')}</td>
          <td style="text-align:center"><span class="badge ${roleCls[u.role] || 'badge-neutral'}">${roleLabel[u.role] || u.role}</span></td>
          <td style="font-size:0.75rem">
            ${u.no_hp ? `<div class="text-mono">${escapeHtml(u.no_hp)}</div>` : ''}
            ${!u.no_hp ? '<span style="color:var(--slate-400)">—</span>' : ''}
          </td>
          <td style="text-align:center"><span class="badge ${statusCls}">${u.status}</span></td>
          <td style="text-align:right; white-space:nowrap">
            ${u.role === 'pengawas' ? `
              <button class="btn btn-secondary" style="font-size:0.7rem; padding:0.25rem 0.5rem; margin-right:0.25rem" data-dabin="${u.id}" data-nama="${escapeHtml(u.nama || u.email)}">
                ${icon('map-pin', 'w-3.5 h-3.5')}<span>Dabin</span>
              </button>
            ` : ''}
            <button class="icon-btn" data-edit="${u.id}" title="Edit">${icon('pencil', 'w-4 h-4')}</button>
            <button class="icon-btn" data-reset="${u.id}" title="Reset Password">${icon('key', 'w-4 h-4')}</button>
            ${!isSelf && u.role !== 'admin' ? `
              ${u.status === 'aktif'
                ? `<button class="icon-btn" style="color:var(--danger)" data-del="${u.id}" title="Nonaktifkan">${icon('user-x', 'w-4 h-4')}</button>`
                : `<button class="icon-btn" style="color:var(--success)" data-aktif="${u.id}" title="Aktifkan">${icon('user-check', 'w-4 h-4')}</button>`}
            ` : ''}
          </td>
        </tr>`;
    }).join('');

    // Bind events
    tbody.querySelectorAll('[data-dabin]').forEach(b => b.addEventListener('click', () => openDabinModal(b.dataset.dabin, b.dataset.nama)));
    tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEdit(b.dataset.edit)));
    tbody.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', () => openReset(b.dataset.reset)));
    tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => doSoftDelete(b.dataset.del)));
    tbody.querySelectorAll('[data-aktif]').forEach(b => b.addEventListener('click', () => doActivate(b.dataset.aktif)));
    
    refreshIcons();
  }

  // ===== CREATE USER =====
  document.getElementById('btnAdd').addEventListener('click', async () => {
    const { data: sekolahList } = await sb.from('sekolah').select('npsn, nama').eq('status', 'aktif').order('nama');

    openModal({
      title: 'Tambah User Baru',
      maxWidth: '600px',
      body: `
        <form id="userForm" style="display:flex; flex-direction:column; gap:1rem">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem">
            <div>
              <label class="label" for="fEmail">Email <span style="color:var(--danger)">*</span></label>
              <input type="email" id="fEmail" class="input" required placeholder="nama@sekolah.sch.id" />
            </div>
            <div>
              <label class="label" for="fPassword">Password Awal <span style="color:var(--danger)">*</span></label>
              <input type="text" id="fPassword" class="input" required value="password123" />
              <p style="font-size:0.75rem; color:var(--slate-500); margin-top:0.25rem">User wajib ganti saat login pertama</p>
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem">
            <div>
              <label class="label" for="fRole">Role <span style="color:var(--danger)">*</span></label>
              <select id="fRole" class="select" required>
                <option value="">— Pilih —</option>
                <option value="ks">Kepala Sekolah</option>
                <option value="pengawas">Pengawas</option>
                <option value="guru">Guru</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div>
              <label class="label" for="fNpsnUser">Sekolah</label>
              <select id="fNpsnUser" class="select">
                <option value="">— Tidak terkait sekolah —</option>
                ${(sekolahList || []).map(s => `<option value="${s.npsn}">${escapeHtml(s.nama)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div>
            <label class="label" for="fNamaUser">Nama Lengkap & Gelar</label>
            <input type="text" id="fNamaUser" class="input" placeholder="Contoh: Dra. Siti Aminah, M.Pd" />
          </div>
          <div>
            <label class="label" for="fNipUser">NIP</label>
            <input type="text" id="fNipUser" class="input text-mono" />
          </div>
        </form>`,
      footer: `
        <button class="btn btn-secondary" data-close>Batal</button>
        <button class="btn btn-primary" id="btnCreate">
          ${icon('user-plus', 'w-4 h-4')}<span>Buat User</span>
        </button>`
    });

    document.getElementById('btnCreate').addEventListener('click', async () => {
      const btn = document.getElementById('btnCreate');
      const email = document.getElementById('fEmail').value.trim();
      const password = document.getElementById('fPassword').value;
      const role = document.getElementById('fRole').value;
      const npsn = document.getElementById('fNpsnUser').value;
      const nama = document.getElementById('fNamaUser').value.trim();
      const nip = document.getElementById('fNipUser').value.trim();

      if (!email) return showToast('Email wajib diisi', 'error');
      if (!password || password.length < 6) return showToast('Password minimal 6 karakter', 'error');
      if (!role) return showToast('Role wajib dipilih', 'error');

      btn.disabled = true;
      btn.innerHTML = `${icon('loader-2', 'w-4 h-4')}<span>Membuat...</span>`;
      refreshIcons();

      try {
        await UsersAPI.create({ email, password, role, npsn, nama, nip });
        closeModal();
        showToast('User berhasil dibuat', 'success');
        await loadData();
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `${icon('user-plus', 'w-4 h-4')}<span>Buat User</span>`;
        refreshIcons();
        showToast('Gagal: ' + err.message, 'error');
      }
    });
  });

  // ===== EDIT USER =====
  function openEdit(id) {
    const u = allItems.find(x => x.id === id);
    if (!u) return;

    openModal({
      title: 'Edit User',
      maxWidth: '600px',
      body: `
        <form style="display:flex; flex-direction:column; gap:1rem">
          <div>
            <label class="label">Email</label>
            <input type="text" class="input" value="${escapeHtml(u.email || '')}" disabled />
            <p style="font-size:0.75rem; color:var(--slate-500); margin-top:0.25rem">Email tidak dapat diubah</p>
          </div>
          <div>
            <label class="label" for="eNama">Nama Lengkap</label>
            <input type="text" id="eNama" class="input" value="${escapeHtml(u.nama || '')}" />
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem">
            <div>
              <label class="label" for="eNip">NIP</label>
              <input type="text" id="eNip" class="input text-mono" value="${escapeHtml(u.nip || '')}" />
            </div>
            <div>
              <label class="label" for="eJk">Jenis Kelamin</label>
              <select id="eJk" class="select">
                <option value="">—</option>
                <option value="L" ${u.jenis_kelamin === 'L' ? 'selected' : ''}>Laki-laki</option>
                <option value="P" ${u.jenis_kelamin === 'P' ? 'selected' : ''}>Perempuan</option>
              </select>
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem">
            <div>
              <label class="label" for="ePangkat">Pangkat/Golongan</label>
              <input type="text" id="ePangkat" class="input" value="${escapeHtml(u.pangkat_golongan || '')}" />
            </div>
            <div>
              <label class="label" for="eStatusPeg">Status Kepegawaian</label>
              <select id="eStatusPeg" class="select">
                <option value="">—</option>
                <option value="PNS" ${u.status_kepegawaian === 'PNS' ? 'selected' : ''}>PNS</option>
                <option value="PPPK" ${u.status_kepegawaian === 'PPPK' ? 'selected' : ''}>PPPK</option>
                <option value="Non ASN" ${u.status_kepegawaian === 'Non ASN' ? 'selected' : ''}>Non ASN</option>
              </select>
            </div>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem">
            <div>
              <label class="label" for="eHp">No. HP</label>
              <input type="text" id="eHp" class="input text-mono" value="${escapeHtml(u.no_hp || '')}" />
            </div>
            <div>
              <label class="label" for="eStatus">Status Akun</label>
              <select id="eStatus" class="select">
                <option value="aktif" ${u.status === 'aktif' ? 'selected' : ''}>Aktif</option>
                <option value="nonaktif" ${u.status === 'nonaktif' ? 'selected' : ''}>Nonaktif</option>
              </select>
            </div>
          </div>
        </form>`,
      footer: `
        <button class="btn btn-secondary" data-close>Batal</button>
        <button class="btn btn-primary" id="btnSave">
          ${icon('save', 'w-4 h-4')}<span>Simpan</span>
        </button>`
    });

    document.getElementById('btnSave').addEventListener('click', async () => {
      const btn = document.getElementById('btnSave');
      const payload = {
        nama: document.getElementById('eNama').value.trim(),
        nip: document.getElementById('eNip').value.trim(),
        jenis_kelamin: document.getElementById('eJk').value,
        pangkat_golongan: document.getElementById('ePangkat').value.trim(),
        status_kepegawaian: document.getElementById('eStatusPeg').value,
        no_hp: document.getElementById('eHp').value.trim(),
        status: document.getElementById('eStatus').value
      };

      btn.disabled = true;
      btn.innerHTML = `${icon('loader-2', 'w-4 h-4')}<span>Menyimpan...</span>`;
      refreshIcons();

      try {
        await UsersAPI.update(id, payload);
        closeModal();
        showToast('User diperbarui', 'success');
        await loadData();
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `${icon('save', 'w-4 h-4')}<span>Simpan</span>`;
        refreshIcons();
        showToast('Gagal: ' + err.message, 'error');
      }
    });
  }

  // ===== RESET PASSWORD =====
  function openReset(id) {
    const u = allItems.find(x => x.id === id);
    if (!u) return;

    openModal({
      title: 'Reset Password',
      maxWidth: '440px',
      body: `
        <p style="font-size:0.875rem; color:var(--slate-600); margin:0 0 1rem">
          Reset password untuk <strong>${escapeHtml(u.nama || u.email)}</strong>.
          User akan diminta ganti password saat login berikutnya.
        </p>
        <div>
          <label class="label" for="rNewPwd">Password Baru</label>
          <input type="text" id="rNewPwd" class="input" value="password123" />
          <p style="font-size:0.75rem; color:var(--slate-500); margin-top:0.25rem">Minimal 6 karakter</p>
        </div>`,
      footer: `
        <button class="btn btn-secondary" data-close>Batal</button>
        <button class="btn btn-primary" id="btnResetPwd">
          ${icon('key', 'w-4 h-4')}<span>Reset</span>
        </button>`
    });

    document.getElementById('btnResetPwd').addEventListener('click', async () => {
      const btn = document.getElementById('btnResetPwd');
      const newPwd = document.getElementById('rNewPwd').value;

      if (!newPwd || newPwd.length < 6) return showToast('Password minimal 6 karakter', 'error');

      btn.disabled = true;
      btn.innerHTML = `${icon('loader-2', 'w-4 h-4')}<span>Reset...</span>`;
      refreshIcons();

      try {
        await UsersAPI.resetPassword(id, newPwd);
        closeModal();
        showToast('Password direset ke: ' + newPwd, 'success');
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `${icon('key', 'w-4 h-4')}<span>Reset</span>`;
        refreshIcons();
        showToast('Gagal: ' + err.message, 'error');
      }
    });
  }

  // ===== ATUR DABIN =====
  async function openDabinModal(pengawasId, nama) {
    const { data: sekolahList } = await sb.from('sekolah').select('npsn, nama').eq('status', 'aktif').order('nama');
    const currentDabin = await UsersAPI.getDabin(pengawasId);
    const allAssignments = await UsersAPI.getAllDabinAssignments();

    // Buat map: NPSN -> { pengawas_id, pengawas_nama }
    const takenMap = {};
    allAssignments.forEach(a => {
      takenMap[a.npsn_sekolah] = {
        id: a.pengawas_id,
        nama: a.pengawas?.nama || 'Pengawas Lain'
      };
    });

    const listHtml = (sekolahList || []).map(s => {
      const isMine = currentDabin.includes(s.npsn);
      const taken = takenMap[s.npsn];
      const isTakenByOther = taken && taken.id !== pengawasId;

      let disabledAttr = '';
      let labelStyle = 'display:flex; align-items:center; gap:0.5rem; padding:0.5rem; border-radius:6px; ';
      let extraText = '';

      // JIKA DIAMBIL PS LAIN: Abu-abu & disable
      if (isTakenByOther) {
        disabledAttr = 'disabled';
        labelStyle += 'opacity:0.6; background:#f8fafc; cursor:not-allowed;';
        extraText = `<span style="margin-left:auto; font-size:0.65rem; color:#991b1b; background:#fee2e2; padding:0.15rem 0.4rem; border-radius:4px; font-weight:600;">Dibina: ${escapeHtml(taken.nama)}</span>`;
      } else {
        labelStyle += 'cursor:pointer;';
      }

      return `
        <label style="${labelStyle}" onmouseover="if(!${!!isTakenByOther}) this.style.background='#f1f5f9'" onmouseout="if(!${!!isTakenByOther}) this.style.background='transparent'">
          <input type="checkbox" value="${s.npsn}" ${isMine ? 'checked' : ''} ${disabledAttr} style="width:16px; height:16px; cursor:${isTakenByOther ? 'not-allowed' : 'pointer'};">
          <span style="font-size:0.85rem; flex:1;"><strong>${escapeHtml(s.npsn)}</strong> — ${escapeHtml(s.nama)}</span>
          ${extraText}
        </label>
      `;
    }).join('');

    openModal({
      title: `Atur Dabin — ${nama}`,
      maxWidth: '520px',
      body: `
        <div style="padding:0.75rem; background:var(--brand-50); border:1px solid var(--brand-100); border-radius:8px; font-size:0.75rem; margin-bottom:1rem; color:var(--brand-900)">
          Centang sekolah yang menjadi tanggung jawab pengawasan. PS hanya akan melihat data dari sekolah yang dicentang.
        </div>
        <div style="max-height:300px; overflow-y:auto; border:1px solid var(--slate-200); border-radius:8px; padding:0.5rem; display:flex; flex-direction:column; gap:0.25rem">
          ${listHtml}
        </div>
      `,
      footer: `
        <button class="btn btn-secondary" data-close>Batal</button>
        <button class="btn btn-primary" id="btnSaveDabin">Simpan Dabin</button>
      `
    });

    document.getElementById('btnSaveDabin').addEventListener('click', async () => {
      const btn = document.getElementById('btnSaveDabin');
      const checked = Array.from(document.querySelectorAll('.modal-panel input[type="checkbox"]:checked')).map(cb => cb.value);
      
      btn.disabled = true; btn.textContent = 'Menyimpan...';
      try {
        await UsersAPI.setDabin(pengawasId, checked);
        closeModal();
        showToast('Dabin berhasil diperbarui', 'success');
        await loadData(); // Reload if needed
      } catch (err) {
        showToast('Gagal: ' + err.message, 'error');
        btn.disabled = false; btn.textContent = 'Simpan Dabin';
      }
    });
  }

  // ===== NONAKTIF / AKTIF =====
  async function doSoftDelete(id) {
    const u = allItems.find(x => x.id === id);
    if (!u) return;
    const ok = await confirmAction('Nonaktifkan user?', `"${u.nama || u.email}" tidak dapat login lagi.`, {
      confirmText: 'Ya, nonaktifkan', danger: true
    });
    if (!ok) return;
    await withLoading('Menonaktifkan...', async () => {
      try {
        await UsersAPI.softDelete(id);
        showToast('User dinonaktifkan', 'success');
        await loadData();
      } catch (err) { showToast('Gagal: ' + err.message, 'error'); }
    });
  }

  async function doActivate(id) {
    await withLoading('Mengaktifkan...', async () => {
      try {
        await UsersAPI.activate(id);
        showToast('User diaktifkan', 'success');
        await loadData();
      } catch (err) { showToast('Gagal: ' + err.message, 'error'); }
    });
  }

  // ===== FILTER =====
  let debounce = null;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    filterText = e.target.value;
    clearTimeout(debounce);
    debounce = setTimeout(renderTable, 300);
  });
  document.getElementById('filterRole').addEventListener('change', (e) => { filterRole = e.target.value; renderTable(); });
  document.getElementById('filterStatus').addEventListener('change', (e) => { filterStatus = e.target.value; renderTable(); });
  document.getElementById('btnReset').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    document.getElementById('filterRole').value = '';
    document.getElementById('filterStatus').value = '';
    filterText = filterRole = filterStatus = '';
    renderTable();
  });
  document.getElementById('btnRefresh').addEventListener('click', loadData);
</script>
</body>
</html>
